shell=zsh
term=xterm-256color
title=foot
font=JetBrainsMono:size=11.5:weight=600
letter-spacing=0
dpi-aware=no
pad=15x15
bold-text-in-bright=no

[scrollback]
lines=10000

[cursor]
style=block
blink=yes
beam-thickness=1.5

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
clipboard-copy=Control+c
clipboard-paste=Control+v
search-start=Control+f
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G
delete-prev-word=Control+BackSpace

[colors]
alpha=0.9
background=0e2216
foreground=c2c7c4

regular0=0e2216
regular1=6E9AA0
regular2=7DB2C3
regular3=94B0A6
regular4=ABC7B4
regular5=CED1B1
regular6=98C7C7
regular7=c2c7c4

bright0=5e7266
bright1=6E9AA0
bright2=7DB2C3
bright3=94B0A6
bright4=ABC7B4
bright5=CED1B1
bright6=98C7C7
bright7=c2c7c4


[text-bindings]
\x03=Control+Shift+c
