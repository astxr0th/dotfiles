# NVIDIA hardware video decoding (VA-API)
env=LIBVA_DRIVER_NAME,nvidia
env=NVD_BACKEND,direct
env=MOZ_DISABLE_RDD_SANDBOX,1

# More option see https://github.com/DreamMaoMao/mango/wiki/
exec-once = /usr/lib/xdg-desktop-portal-wlr &
#exec-once = wlr-randr --output DP-2 --mode 1920x1080@239.759995
exec-once = awww-daemon &
exec-once = dbus-update-activation-environment --all &
exec-once = wl-paste --watch cliphist store &
#exec-once = waybar &
exec-once = qs &
#exec-once = swaync &  (quickshell handles notifications)
exec-once = equibop &
exec-once = steam &
exec-once = /usr/libexec/polkit-gnome-authentication-agent-1 &
#exec-once = gsr-ui  (replaced by the quickshell recorder)


#monitor
monitorrule=make:Samsung Electric Company,model:Odyssey G40B,width:1920,height:1080,refresh:240




# Window effect
blur=0
blur_layer=0
blur_optimized=1
blur_params_num_passes = 3
blur_params_radius = 3
blur_params_noise = 0
# blur_params_brightness = 0.9
# blur_params_contrast = 0.9
# blur_params_saturation = 1.2
blur_params_brightness = 1
blur_params_contrast = 1
blur_params_saturation = 1
syncobj_enable = 1
shadows=0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadowscolor= 0x000000ff
border_radius=14
# layer_border_radius=10
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=0.9

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical (current mango)
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=zoom
# animation_fade_in=1
# animation_fade_out=1
tag_animation_direction=0
zoom_initial_ratio=0.8
zoom_end_ratio=0.95
# fadein_begin_opacity=0.5
# fadeout_begin_opacity=0.8
animation_duration_move=400
animation_duration_open=400
animation_duration_tag=600
animation_duration_close=400
animation_duration_focus=400
animation_curve_open=0.05,0.9,0.1,1.05
animation_curve_move=0.05,0.9,0.1,1.05
animation_curve_tag=0.05,0.9,0.1,1.05
animation_curve_close=0.05,0.9,0.1,1.05
animation_curve_focus=0.05,0.9,0.1,1.05
# (zenities) animation_type_open=zoom
# (zenities) zoom_initial_ratio=0.3
# (zenities) zoom_end_ratio=0.8
fadein_begin_opacity = 0.9
# (zenities) animation_duration_open=700
# (zenities) animation_curve_open=0.22,1.0,0.36,1

# close/unmap window
# (zenities) animation_type_close=zoom
# (zenities) animation_duration_close=400
# (zenities) animation_curve_close=0.08,0.92,0,1

# tag/workspace switch
# (zenities) tag_animation_direction=1
# animation_type_tag=minimize
animation_fade_in=1
animation_fade_out=1
# (zenities) animation_duration_tag=400
# (zenities) animation_curve_tag=0.46,1.0,0.29,1

# move/focus
# (zenities) animation_duration_move=500
# (zenities) animation_curve_move=0.46,1.0,0.29,1
# (zenities) animation_duration_focus=500
# (zenities) animation_curve_focus=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=0
default_mfact=0.55
default_nmaster=1
smartgaps=0

# Overview Setting
hotarea_size=10
enable_hotarea=0
ov_tab_mode=0
overviewgappi=5
overviewgappo=30

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1
allow_tearing = 1
# keyboard
repeat_rate=40
repeat_delay=250
numlockon=0
xkb_rules_layout=us
#xkb_options=grp:alt_shift_toggle

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0
accel_speed = 1
# Appearance
gappih=10
gappiv=10
gappoh=24
gappov=24
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=0
rootcolor=0x201b14ff
bordercolor=0x444444ff
focuscolor=0xc9b890ff
maximizescreencolor=0x89aa61ff
urgentcolor=0xad401fff
scratchpadcolor=0x516c93ff
globalcolor=0xb153a7ff
overlaycolor=0x14a57cff

# rule {
#     app_id = "waybar"
#     no_decoration = true
# }

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=SUPER,r,reload_config

# menu and terminal
# bind=SUPER,space,spawn_shell,rofi -show drun || pkill rofi
bind=SUPER,space,spawn,qs ipc call panel toggle launcher
bind=SUPER,h,spawn,qs ipc call widgets toggle
bind=SUPER+SHIFT,s,spawn,qs ipc call panel toggle screenshot
bind=SUPER,w,spawn,qs ipc call panel toggle wallpaper
# recorder (gsr-ui replacement, same default hotkeys)
bind=ALT,z,spawn,qs ipc call recorder toggle
bind=ALT,F9,spawn,qs ipc call recorder record
bind=ALT+CTRL,F9,spawn,qs ipc call recorder region
bind=ALT,F7,spawn,qs ipc call recorder pause
bind=ALT,F10,spawn,qs ipc call recorder save
bind=ALT+SHIFT,F10,spawn,qs ipc call recorder replay
bind=ALT,F11,spawn,qs ipc call recorder saveLast 60
bind=ALT,F12,spawn,qs ipc call recorder saveLast 600
bind=SUPER,Return,spawn,kitty 

#file manager
bind=SUPER,E,spawn,kitty -e yazi

#fast config edit
bind=SUPER+SHIFT,C, spawn,kitty -e nvim /home/wxw/.config/mango/config.conf

#toggle control center (right-side widgets + notifications)
bind=SUPER+SHIFT,space,spawn,qs ipc call widgets toggle

#browser
bind=SUPER, B, spawn, zen-browser

# exit
bind=SUPER+SHIFT,Q,quit
bind=SUPER,Q,killclient,

# switch window focus

bind=ALT,Left,focusdir,left
bind=ALT,Right,focusdir,right
bind=ALT,Up,focusdir,up
bind=ALT,Down,focusdir,down

# swap window
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right

# switch window status
bind=SUPER,g,toggleglobal,
bind=ALT,Tab,toggleoverview,
bind=SUPER,s,togglefloating,
bind=ALT,a,togglemaximizescreen,
bind=SUPER,f,togglefullscreen,
bind=SUPER+SHIFT,f,togglefakefullscreen,
bind=SUPER,i,minimized,
bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,I,restore_minimized
bind=ALT+SHIFT,z,toggle_scratchpad

# scroller layout
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,

# switch layout
bind=SUPER,n,switch_layout
#ts toggles float mode
#bind=SUPER,z,togglefloating

# tag switch
bind=SUPER,Left,viewtoleft,0
bind=CTRL,Left,viewtoleft_have_client,0
bind=SUPER,Right,viewtoright,0
bind=CTRL,Right,viewtoright_have_client,0
bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# monitor switch
bind=alt+shift,Left,focusmon,left
bind=alt+shift,Right,focusmon,right
bind=SUPER+Alt,Left,tagmon,left
bind=SUPER+Alt,Right,tagmon,right

# gaps
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# movewin
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0

# resizewin
bind=CTRL+ALT,Up,resizewin,+0,-50
bind=CTRL+ALT,Down,resizewin,+0,+50
bind=CTRL+ALT,Left,resizewin,-50,+0
bind=CTRL+ALT,Right,resizewin,+50,+0
bind=SUPER,V,create_virtual_output
bind=SUPER+SHIFT,v,destroy_all_virtual_output
# Mouse Button Bindingsallow_tearing
# NONE mode key only work in ov mode
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client


# layer rule
layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:fade,layer_name:rofi
layerrule=noanim:1,layer_name:zenities-center
layerrule=noanim:1,layer_name:zenities-network
layerrule=noanim:1,layer_name:zenities-notifications
layerrule=noanim:1,layer_name:zenities-mixer
layerrule=noanim:1,layer_name:zenities-wallpaper
layerrule=noanim:1,layer_name:zenities-launcher
layerrule=noanim:1,layer_name:zenities-screenshot
# layerrule=noanim:1,layer_name:waybar
# windowrule = rounding 10, waybar
layerrule=noblur:1,layer_name:kitty
# layerrule=border_radius=10,layer_name:Waybar
# windowrule=isfloating=1,


windowrule=isfloating:1,appid:zen
windowrule=width:1000,height:600,appid:zen

bind = none,XF86AudioRaiseVolume, spawn, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bind = none,XF86AudioLowerVolume, spawn, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

source = ./float.conf

# pywal-synced colors (written by quickshell)
source-optional=~/.config/mango/colors.conf
